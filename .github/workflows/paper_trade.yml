name: Paper trading (scheduled)

on:
  schedule:
    # Runs a few minutes past the hour, matching the 1h candle timeframe in config.yaml.
    # Adjust this if you change `timeframe`.
    - cron: "5 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated paper_state.json back to the repo

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one paper-trading cycle
        run: python paper_trade.py --once

      - name: Regenerate performance report
        run: python report.py

      - name: Build live-dashboard sync data (candles + state, committed for the cloud sync routine)
        run: python sync_dashboard.py --out-dir dashboard_data

      - name: Commit updated paper trading state + report + dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_state.json dashboard_data/
          if [ -f paper_report.png ]; then git add paper_report.png; fi
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
            exit 0
          fi
          git commit -m "Update paper trading state + report [skip ci]"
          # retrain.yml may push around the same time -- rebase and retry once on conflict
          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git pull --rebase origin main
          done
