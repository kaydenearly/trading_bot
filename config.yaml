# Trading bot configuration

exchange: bitstamp       # ccxt exchange id used for PUBLIC market data only (no keys needed).
                         # Switched from kraken: kraken's public OHLC endpoint silently
                         # hard-caps at ~720 candles no matter what's requested. Bitstamp
                         # honors real pagination -- BTC/USD hourly data is available back
                         # to 2012 -- with comparable USD-pair breadth (116 active pairs).
timeframe: 1h            # candle size: 1m, 5m, 15m, 1h, 4h, 1d ...
history_limit: 8760       # ~1 year of hourly candles. Raise this for deeper research
                         # (bitstamp supports it); kept at 1yr by default to keep routine
                         # fetches/backtests fast.

# Multi-symbol universe: universe.py screens the most liquid USD pairs on
# `exchange`, backtests each one, and picks the top `select_top_n` by
# backtest Sharpe ratio. The result is saved to `symbols_file` -- that's
# what train.py / backtest.py / paper_trade.py / report.py all read.
universe:
  quote: USD
  scan_pool_size: 25      # how many of the most liquid USD pairs to backtest and consider
  select_top_n: 5          # how many of those to actually trade, equal-weighted
  min_candles: 200         # skip a candidate with less usable history than this
symbols_file: symbols.json
models_dir: models          # one <symbol>.joblib per actively traded symbol

# Feature / label settings
label_horizon: 4          # predict direction this many bars ahead
label_threshold: 0.0015   # min forward return (as a fraction) to call it "up" vs "down"

# Single train/test split used by backtest.py / train.py / universe.py (time
# order preserved, no shuffling). This is ONE fold -- see walk_forward.py for
# proper multi-fold out-of-sample validation, which is what should actually
# be trusted for a robustness judgment.
train_fraction: 0.7

# Walk-forward validation (walk_forward.py): many rolling folds instead of a
# single split, so "robust" means "worked across many historical periods,"
# not "worked once." Each fold trains on everything before it (expanding
# window) and tests on the next `test_window_candles`, never touching its
# own future.
walk_forward:
  initial_train_candles: 2160   # ~90 days at 1h: first fold's training window
  test_window_candles: 360       # ~15 days at 1h: each fold's held-out test window
  step_candles: 360              # advance by one test window per fold
  min_folds: 5                   # skip a symbol if fewer folds than this are possible

# Trading signal thresholds (model outputs probability of "up")
buy_threshold: 0.55       # go long when P(up) exceeds this
sell_threshold: 0.45      # go flat when P(up) drops below this

# Risk management. Position sizing is risk-based (inversely proportional to
# volatility via ATR) rather than "100% in or flat" -- a losing trade that
# hits its stop should cost about risk_per_trade_pct of equity, no matter
# how volatile the symbol is. Stops/targets are ATR-multiples from entry;
# the stop only ever ratchets favorably (never loosens) and only
# repositions once it would improve by more than the noise threshold.
risk:
  risk_per_trade_pct: 0.01        # risk this fraction of a symbol's sleeve equity per trade
  stop_atr_mult: 2.0               # stop-loss distance from entry, in ATRs
  target_atr_mult: 4.0             # take-profit distance from entry, in ATRs (2:1 reward:risk)
  stop_trail_threshold_atr_mult: 0.5   # only move the trailing stop when it improves by at least this many ATRs

  # Portfolio-wide controls (enforced in paper_trade.py / paper_broker.py,
  # across all symbols -- these don't apply inside a single symbol's
  # backtest/walk-forward run, which is deliberately isolated per symbol).
  max_concurrent_positions: 3      # at most this many symbols open a position at once
  max_portfolio_exposure_pct: 0.6  # at most this fraction of total equity deployed at once
  max_daily_loss_pct: 0.05         # halt new entries if equity drops this much from today's starting level
  max_weekly_loss_pct: 0.10        # same, over a rolling 7 days
  max_drawdown_pct: 0.20           # emergency shutdown: halt ALL new entries if equity drawdown from its peak exceeds this
  max_consecutive_losses: 4        # pause new entries (portfolio-wide) after this many losing trades in a row
  cooldown_cycles: 5               # after a consecutive-loss pause, skip this many cycles before resuming

# Simulated trading costs (applied in both backtest and paper trading)
fee_rate: 0.001           # 0.1% per trade, typical spot taker fee
slippage_bps: 5           # 5 basis points of adverse slippage per fill

# Paper trading
starting_cash: 10000      # total across all active symbols, split equally
poll_seconds: 60          # how often to check for a new candle in paper_trade.py
state_file: paper_state.json
risk_state_file: risk_state.json   # portfolio-wide risk tracker (peak equity, day/week loss, kill switch)

# TradingView webhook receiver (webhook_server.py)
# TradingView alerts POST a JSON payload here when they fire. This only ever
# updates the local paper_broker simulation -- it never places a real order.
webhook_host: 127.0.0.1   # bind to localhost; use ngrok/cloudflared to expose it, don't bind 0.0.0.0
webhook_port: 8787
webhook_secret: "REPLACE_ME_WITH_A_RANDOM_SECRET"   # generate with: python3 -c "import secrets; print(secrets.token_urlsafe(24))" -- don't commit your real value
webhook_state_file: tv_paper_state.json   # separate paper account so it doesn't collide with paper_trade.py
