# Trading bot configuration

exchange: kraken         # ccxt exchange id used for PUBLIC market data only (no keys needed)
symbol: BTC/USD
timeframe: 1h            # candle size: 1m, 5m, 15m, 1h, 4h, 1d ...
history_limit: 3000       # number of historical candles to fetch for training/backtest

# Feature / label settings
label_horizon: 4          # predict direction this many bars ahead
label_threshold: 0.0015   # min forward return (as a fraction) to call it "up" vs "down"

# Train/test split for walk-forward backtest (no shuffling — time order preserved)
train_fraction: 0.7

# Trading signal thresholds (model outputs probability of "up")
buy_threshold: 0.55       # go long when P(up) exceeds this
sell_threshold: 0.45      # go flat when P(up) drops below this

# Simulated trading costs (applied in both backtest and paper trading)
fee_rate: 0.001           # 0.1% per trade, typical spot taker fee
slippage_bps: 5           # 5 basis points of adverse slippage per fill

# Paper trading
starting_cash: 10000
poll_seconds: 60          # how often to check for a new candle in paper_trade.py
state_file: paper_state.json
model_file: model.joblib

# TradingView webhook receiver (webhook_server.py)
# TradingView alerts POST a JSON payload here when they fire. This only ever
# updates the local paper_broker simulation -- it never places a real order.
webhook_host: 127.0.0.1   # bind to localhost; use ngrok/cloudflared to expose it, don't bind 0.0.0.0
webhook_port: 8787
webhook_secret: "REPLACE_ME_WITH_A_RANDOM_SECRET"   # generate with: python3 -c "import secrets; print(secrets.token_urlsafe(24))" -- don't commit your real value
webhook_state_file: tv_paper_state.json   # separate paper account so it doesn't collide with paper_trade.py
